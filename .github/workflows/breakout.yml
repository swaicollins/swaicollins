1, "x": 691, "y": 122, "alive": 1}];
  var levelColors = ["#ebedf0", "#9be9a8", "#40c4d8", "#0891b2", "#0e7490"];

  var ballEl   = document.getElementById("ball-" + THEME);
  var paddleEl = document.getElementById("paddle-" + THEME);
  var scoreEl  = document.getElementById("score-" + THEME);

  var speed = 2.8;
  var paddleY = GRID_TOP + GRID_H + BALL_ZONE - PADDLE_H - 6;
  var paddleX = SVG_W / 2 - PADDLE_W / 2;
  var bx, by, vx, vy, score = 0;
  var bricks = JSON.parse(JSON.stringify(bricksData));

  function fixAngle() {
    var min = speed * MIN_VY;
    if (Math.abs(vy) < min) {
      vy = (vy < 0 ? -1 : 1) * min;
      var sgn = vx < 0 ? -1 : 1;
      vx = sgn * Math.sqrt(speed * speed - vy * vy);
    }
  }

  function resetBall() {
    bx = paddleX + PADDLE_W / 2;
    by = paddleY - BALL_R - 2;
    var a = (-45 - Math.random() * 60) * Math.PI / 180;
    vx = speed * Math.cos(a);
    vy = speed * Math.sin(a);
  }

  function resetGame() {
    bricks = JSON.parse(JSON.stringify(bricksData));
    score = 0;
    bricks.forEach(function(b) {
      var el = document.getElementById("b" + THEME + "-" + b.col + "-" + b.row);
      if (el) {
        el.setAttribute("fill", levelColors[b.level]);
        el.setAttribute("opacity", b.level > 0 ? "1" : "0.6");
      }
    });
    resetBall();
  }

  function movePaddle() {
    paddleX += (bx - PADDLE_W / 2 - paddleX) * 0.08;
    if (paddleX < LEFT) paddleX = LEFT;
    if (paddleX + PADDLE_W > RIGHT) paddleX = RIGHT - PADDLE_W;
  }

  function checkBrickCollision() {
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var r = b.x + CELL_W, bt = b.y + CELL_H;
      if (bx + BALL_R > b.x && bx - BALL_R < r && by + BALL_R > b.y && by - BALL_R < bt) {
        b.alive = 0;
        score += b.level * 10;
        var el = document.getElementById("b" + THEME + "-" + b.col + "-" + b.row);
        if (el) el.setAttribute("opacity", "0");
        var ox = Math.min(bx + BALL_R - b.x, r - (bx - BALL_R));
        var oy = Math.min(by + BALL_R - b.y, bt - (by - BALL_R));
        if (ox < oy) vx = -vx; else vy = -vy;
        fixAngle();
        return;
      }
    }
  }

  function tick() {
    bx += vx; by += vy;

    if (bx - BALL_R < LEFT)  { bx = LEFT + BALL_R;  vx =  Math.abs(vx); }
    if (bx + BALL_R > RIGHT) { bx = RIGHT - BALL_R; vx = -Math.abs(vx); }
    if (by - BALL_R < GRID_TOP - 10) { by = GRID_TOP - 10 + BALL_R; vy = Math.abs(vy); }

    movePaddle();
    if (vy > 0 && by + BALL_R >= paddleY && by + BALL_R <= paddleY + PADDLE_H + 4 &&
        bx >= paddleX - 4 && bx <= paddleX + PADDLE_W + 4) {
      by = paddleY - BALL_R - 1;
      var hit = (bx - paddleX) / PADDLE_W - 0.5;
      vx = speed * 1.2 * hit;
      vy = -Math.abs(vy);
      var n = Math.sqrt(vx * vx + vy * vy);
      vx = vx / n * speed; vy = vy / n * speed;
      fixAngle();
    }

    if (by - BALL_R > SVG_H) resetBall();

    checkBrickCollision();

    if (!bricks.some(function(b) { return b.alive; })) {
      // FIX: the old code returned here without scheduling another frame, so the game froze for good
      setTimeout(function() { resetGame(); requestAnimationFrame(tick); }, 800);
      return;
    }

    ballEl.setAttribute("cx", bx.toFixed(1));
    ballEl.setAttribute("cy", by.toFixed(1));
    paddleEl.setAttribute("x", paddleX.toFixed(1));
    if (scoreEl) scoreEl.textContent = "Score: " + score;
    requestAnimationFrame(tick);
  }

  setTimeout(function() { resetBall(); requestAnimationFrame(tick); }, 500);
})();
